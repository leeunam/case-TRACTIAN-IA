openapi: 3.1.0
info:
  title: Tractian Industrial Support API (Challenge Inteli)
  description: |
    API industrial simplificada para o Challenge "Engenharia e Avaliação de Agentes Industriais".
    Dados sintéticos, anonimizados. Serve como contexto comum às duas partes do projeto
    (construção e avaliação do agente).

    ## Comportamento probabilístico
    Os endpoints de **consulta** (GET) podem retornar variações controladas por `seed`:
    - `complete` — retorno completo
    - `partial` — informação parcial (campos/etapas faltantes)
    - `inconclusive` — resultado inconclusivo
    - `conflict` — conflito entre fontes
    - `unavailable` — indisponibilidade temporária

    O `seed` (query param) torna o comportamento determinístico para reprodutibilidade na
    avaliação. Sem `seed`, recurso e categoria são convertidos por hash em um modo estável usando
    a distribuição configurada; chamadas iguais não são sorteadas novamente.

    ## Ações de alto impacto
    As operações de escrita (POST/PATCH de impacto) exigem **parâmetros válidos + `justification`**
    (string ≥ 20 chars justificando a ação). Uma chamada aceita retorna um recibo `ActionResult`,
    **sem ciclo adicional de status**. Neste simulador, o recibo não altera os recursos Parquet e
    não deve ser interpretado como confirmação de uma mutação consultável por GET.

    ## Autenticação
    `x-user-id` identifica a pessoa usuária nas rotas de ação e em `/users/me`; as consultas GET
    industriais são anônimas neste simulador. Ações vinculadas a ativo/caso também exigem que o
    recurso pertença à empresa dessa pessoa. Sem token.
  version: 0.1.0
  contact:
    name: TRACTIAN x Inteli — Challenge
servers:
  - url: http://localhost:8000
    description: Ambiente local de demonstração

# ---------------------------------------------------------------------------
# Convenções de resposta
#   - Cada GET de consulta pode envolver o corpo em um envelope {mode, notes, data}
#     onde `mode` ∈ complete|partial|inconclusive|conflict|unavailable reflete o comportamento.
#   - `notes` descreve o que falta / o motivo do conflito / indisponibilidade.
# ---------------------------------------------------------------------------

components:
  securitySchemes:
    UserContext:
      type: apiKey
      in: header
      name: x-user-id
      description: ID da pessoa usuária (define perfil/permissões e contexto de empresa).

  parameters:
    Seed:
      name: seed
      in: query
      description: "Semente para tornar o envelope determinístico. As sentinelas complete e degraded forçam, respectivamente, os modos completo e parcial; overrides fixos do cenário têm precedência."
      required: false
      schema: { type: string }

  responses:
    ValidationError:
      description: Parâmetros ausentes ou inválidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Contexto de usuário ausente ou desconhecido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Permissão insuficiente ou recurso fora da empresa da pessoa usuária.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [VALIDATION_ERROR, UNAUTHORIZED, IDEMPOTENCY_PAYLOAD_CONFLICT, IDEMPOTENCY_IN_PROGRESS, IDEMPOTENCY_OUTCOME_UNKNOWN, INTERNAL_ERROR, UNAVAILABLE] }
        message: { type: string }

    Company:
      type: object
      properties:
        id: { type: string, examples: [comp_forja_br] }
        name: { type: string, examples: [Forja Brasil] }
        segment: { type: string, examples: [metalurgia] }
        timezone: { type: string, examples: [America/Sao_Paulo] }

    User:
      type: object
      properties:
        id: { type: string, examples: [usr_ana] }
        name: { type: string, examples: [Ana Mantovani] }
        role: { type: string, enum: [operator, mechanic, reliability_analyst, maintenance_manager, coordinator, engineer, electrician] }
        permissions:
          type: array
          items: { type: string, enum: [read, action_low, action_high, escalate] }
        company_id: { type: string }

    AssetConfig:
      type: object
      description: Configuração técnica do ativo (usada em contexto de diagnóstico).
      additionalProperties: false
      minProperties: 1
      properties:
        machine_type: { type: string, enum: [compressor, fan, gearbox, mill, motor_dc, motor_induction, pump, spindle] }
        rotation_rpm: { type: number, exclusiveMinimum: 0, examples: [1780] }
        bearing_specs:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            part_number: { type: string, examples: [NU 310] }
            bpfo_hz: { type: number, minimum: 0 }
            bpfi_hz: { type: number, minimum: 0 }
            bsf_hz: { type: number, minimum: 0 }
            ftf_hz: { type: number, minimum: 0 }
        line_frequency_hz: { type: number, exclusiveMinimum: 0, examples: [60] }

    Baseline:
      type: object
      description: |
        Estado "normal" aprendido do próprio ativo/ponto (aprendizado prévio do estado normal;
        falhas por desvio são detectadas comparando o sinal atual a este baseline). Não usa normas ISO.
        Falhas sintomáticas (ex.: lubrificação) não dependem de baseline.
      properties:
        id: { type: string }
        asset_id: { type: string }
        point_id: { type: string }
        state: { type: string, enum: [learning, established, invalidated] }
        detection_mode: { type: string, enum: [baseline, symptom], description: "baseline = detecção por desvio; symptom = detecção sintomática (lubrificação)" }
        established_at: { type: [string, "null"], format: date-time }
        invalidated_at: { type: [string, "null"], format: date-time }
        invalidation_reason: { type: [string, "null"], examples: [maintenance_intervention, config_change] }
        features:
          type: array
          description: Bandas/métricas que compõem o baseline com seus valores de referência.
          items:
            type: object
            properties:
              feature: { type: string, examples: [rms_mm_s, bpfo_amplitude, shock_pulse] }
              reference: { type: number }
              tolerance: { type: number }
        learnable: { type: boolean, description: "Se o modelo consegue aprender baseline para este ativo/tipo" }

    Asset:
      type: object
      properties:
        id: { type: string, examples: [asset_M101] }
        name: { type: string, examples: [Motor principal da forja] }
        company_id: { type: string }
        criticality: { type: string, enum: [low, medium, high, critical] }
        plant: { type: string }
        line: { type: string }
        parent_asset_id: { type: [string, "null"] }
        machine_type: { type: string, enum: [compressor, fan, gearbox, mill, motor_dc, motor_induction, pump, spindle] }
        rotation_rpm: { type: number }
        bearing_pn: { type: [string, "null"] }
        bpfo_hz: { type: [number, "null"] }
        bpfi_hz: { type: [number, "null"] }
        bsf_hz: { type: [number, "null"] }
        ftf_hz: { type: [number, "null"] }
        line_frequency_hz: { type: [number, "null"] }
        sensor_status: { type: string, enum: [online, offline, degraded] }
        points:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              asset_id: { type: string }
              location: { type: string, examples: [DE, NDE, axial] }
              sensor_status: { type: string, enum: [online, offline, degraded] }

    Analysis:
      type: object
      description: Diagnóstico (insight) produzido por modelo ou especialista.
      properties:
        id: { type: string, examples: [an_9901] }
        asset_id: { type: string }
        point_id: { type: string }
        type: { type: string, examples: [imbalance, misalignment, bearing_fault, electrical_fault, looseness, lubrication] }
        detection_mode: { type: string, enum: [baseline, symptom], description: "baseline = desvio do estado normal aprendido; symptom = presença do sintoma (ex.: lubrificação)" }
        severity: { type: string, enum: [none, low, medium, high, critical] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        baseline_state_at_detection: { type: string, enum: [learning, established, invalidated, not_applicable], description: "Estado do baseline quando a detecção ocorreu (not_applicable p/ falhas sintomáticas)" }
        evidence:
          type: array
          items:
            type: object
            properties:
              metric: { type: string, examples: [bpfo_amplitude] }
              value: { type: number }
              reference: { type: [number, "null"], description: "Valor de referência do baseline (null p/ detecção sintomática)" }
              note: { type: string }
        limitations:
          type: array
          items: { type: string, examples: [low_signal_quality, coverage_partial, baseline_learning, baseline_invalidated] }
        model_version: { type: string }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [current, stale, pending, inconclusive] }

    RmsSeries:
      type: object
      properties:
        asset_id: { type: string }
        point_id: { type: string }
        unit: { type: string, examples: [mm/s] }
        baseline_reference: { type: [number, "null"], description: "RMS de referência do baseline aprendido (mm/s); null se baseline em learning ou falha sintomática" }
        baseline_state: { type: string, enum: [learning, established, invalidated, not_applicable] }
        alarm_threshold: { type: [number, "null"], description: "Limiar de alarme derivado do baseline (reference + tolerância)" }
        samples:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, format: date-time }
              value: { type: number }

    Spectrum:
      type: object
      description: Espectro FFT simplificado (picos relevantes + bandas).
      properties:
        asset_id: { type: string }
        point_id: { type: string }
        peaks:
          type: array
          items:
            type: object
            properties:
              freq_hz: { type: number }
              amplitude_mm_s: { type: number }
              note: { type: [string, "null"] } # ex.: "1x", "BPFO", "2x line"
        bands_missing:
          type: array
          description: Bandas ausentes na medição; pode ser não vazio em qualquer modo do envelope.
          items: { type: string }
        collected_at: { type: string, format: date-time }

    DataQuality:
      type: object
      properties:
        asset_id: { type: string }
        point_id: { type: string }
        completeness: { type: number, minimum: 0, maximum: 1 }
        freshness_minutes: { type: integer } # minutos desde última amostra válida
        snr_db: { type: number }
        staleness_flag: { type: boolean }

    Model:
      type: object
      properties:
        id: { type: string, examples: [mdl_vib_v3] }
        version: { type: string, examples: [3.2.1] }
        coverage:
          type: array
          items:
            type: object
            properties:
              machine_type: { type: string }
              supported: { type: boolean, enum: [true, false] }
              can_learn_baseline: { type: boolean, description: "Se o modelo consegue aprender baseline para este tipo (false → só detecção sintomática)" }
              note: { type: [string, "null"] }
        requirements:
          type: object
          properties:
            min_completeness: { type: number }
            min_snr_db: { type: number }
            min_rotation_rpm: { type: [number, "null"] }
        processing_state: { type: string, enum: [idle, running, pending, delayed, failed] }
        last_run_at: { type: [string, "null"], format: date-time }

    KnowledgeDoc:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [procedure, glossary, guidance] }
        title: { type: string }
        body: { type: string }
        tags: { type: array, items: { type: string } }

    QueryEnvelope:
      type: object
      description: Envelope de consulta com modo de variação controlado.
      properties:
        mode: { type: string, enum: [complete, partial, inconclusive, conflict, unavailable] }
        notes: { type: [string, "null"] }
        data: {} # payload específico do endpoint

    ActionRequest:
      type: object
      required: [justification]
      properties:
        justification:
          type: string
          minLength: 20
          description: Justificativa da ação (≥ 20 caracteres após remover espaços das extremidades).
        params:
          type: object
          description: Parâmetros específicos da ação.
          additionalProperties: true

    ActionResult:
      type: object
      required: [action_id, message]
      properties:
        accepted: { type: boolean, default: true }
        action_id: { type: string }
        message: { type: string }

paths:

  # ---- Contexto ---------------------------------------------------------
  /companies/{companyId}:
    get:
      tags: [Contexto]
      operationId: getCompany
      parameters:
        - $ref: '#/components/parameters/Seed'
        - name: companyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Empresa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /companies/{companyId}/assets:
    get:
      tags: [Contexto]
      operationId: listAssetsByCompany
      parameters:
        - $ref: '#/components/parameters/Seed'
        - name: companyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Lista de ativos da empresa. }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me:
    get:
      tags: [Contexto]
      operationId: getCurrentUser
      security: [{ UserContext: [] }]
      responses:
        '200':
          description: Pessoa usuária autenticada (perfil/permissões).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---- Ativos -----------------------------------------------------------
  /assets/{assetId}:
    get:
      tags: [Ativos]
      operationId: getAsset
      parameters:
        - $ref: '#/components/parameters/Seed'
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cadastro plano do ativo com configuração técnica e pontos de medição.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Ativos]
      operationId: updateAssetConfig
      description: Solicita alteração de criticidade/configuração técnica. Ação de impacto.
      security: [{ UserContext: [] }]
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [justification, changes]
              properties:
                justification:
                  type: string
                  minLength: 20
                  description: Mínimo de 20 caracteres após remover espaços das extremidades.
                changes:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    criticality: { type: string, enum: [low, medium, high, critical] }
                    config: { $ref: '#/components/schemas/AssetConfig' }
      responses:
        '200':
          description: Solicitação de atualização aceita; o recurso Parquet não é alterado pelo simulador.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Análises ---------------------------------------------------------
  /assets/{assetId}/analyses:
    get:
      tags: [Análises]
      operationId: listAnalyses
      parameters:
        - $ref: '#/components/parameters/Seed'
        - name: assetId
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          description: Filtro literal; valor desconhecido resulta em lista vazia.
          schema: { type: string }
      responses:
        '200': { description: Lista de análises do ativo. }
        '404': { $ref: '#/components/responses/NotFound' }

  /analyses/{analysisId}:
    get:
      tags: [Análises]
      operationId: getAnalysis
      parameters:
        - $ref: '#/components/parameters/Seed'
        - name: analysisId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detalhe da análise (evidência, confiança, limitações).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /analyses/{analysisId}/reprocess:
    post:
      tags: [Análises]
      operationId: reprocessAnalysis
      description: Solicita o reprocesso. Ação de impacto; exige justificativa e retorna recibo sem alterar a análise em Parquet.
      security: [{ UserContext: [] }]
      parameters:
        - name: analysisId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          description: Identifica uma intenção de reprocessamento e deve ser reutilizada somente em retries do mesmo pedido. Deve ter de 1 a 255 caracteres e não conter espaços.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^\S+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionRequest' }
      responses:
        '200':
          description: Reprocesso aceito.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '400':
          description: Idempotency-Key ou justificativa ausente/inválida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                validationError:
                  summary: Header ausente ou inválido
                  value:
                    code: VALIDATION_ERROR
                    message: Header Idempotency-Key ausente ou inválido.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency-Key reutilizada com payload diferente ou ainda em processamento; também indica resultado anterior incerto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                payloadConflict:
                  summary: Mesma chave, payload diferente
                  value:
                    code: IDEMPOTENCY_PAYLOAD_CONFLICT
                    message: Idempotency-Key já usada com payload diferente.
                inProgress:
                  summary: A mesma intenção ainda está em andamento
                  value:
                    code: IDEMPOTENCY_IN_PROGRESS
                    message: Já existe um processamento em andamento para esta chave.
                outcomeUnknown:
                  summary: Resultado anterior incerto
                  value:
                    code: IDEMPOTENCY_OUTCOME_UNKNOWN
                    message: O resultado da tentativa anterior é incerto; verifique antes de repetir.
        '500':
          description: Falha inesperada durante o processamento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                internalError:
                  summary: Falha interna sem exposição de detalhes
                  value:
                    code: INTERNAL_ERROR
                    message: Erro interno durante o processamento.
        '422': { description: Corpo ausente ou não representado por um objeto JSON. }

  /analyses/{analysisId}/request-specialist:
    post:
      tags: [Análises]
      operationId: requestSpecialistAnalysis
      description: Solicita análise especializada. Ação de impacto; exige justificativa.
      security: [{ UserContext: [] }]
      parameters:
        - name: analysisId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionRequest' }
      responses:
        '200':
          description: Acionamento aceito.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Corpo ausente ou não representado por um objeto JSON. }

  # ---- Dados técnicos ---------------------------------------------------
  /assets/{assetId}/baseline:
    get:
      tags: [Dados técnicos]
      operationId: getBaseline
      description: |
        Estado "normal" aprendido do ativo/ponto. Permite explicar por que um insight não foi
        gerado (baseline em `learning`), por que está desatualizado (`invalidated` após manutenção)
        e como uma falha foi detectada (desvio vs. `symptom`). Falhas sintomáticas (lubrificação)
        retornam `detection_mode = symptom` e `learnable = false`.
      parameters:
        - $ref: '#/components/parameters/Seed'
        - name: assetId
          in: path
          required: true
          schema: { type: string }
        - name: point_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Baseline aprendido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assets/{assetId}/rms:
    get:
      tags: [Dados técnicos]
      operationId: getRmsSeries
      parameters:
        - $ref: '#/components/parameters/Seed'
        - name: assetId
          in: path
          required: true
          schema: { type: string }
        - name: point_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Série temporal de RMS.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assets/{assetId}/spectrum:
    get:
      tags: [Dados técnicos]
      operationId: getSpectrum
      parameters:
        - $ref: '#/components/parameters/Seed'
        - name: assetId
          in: path
          required: true
          schema: { type: string }
        - name: point_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Espectro FFT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assets/{assetId}/data-quality:
    get:
      tags: [Dados técnicos]
      operationId: getDataQuality
      parameters:
        - $ref: '#/components/parameters/Seed'
        - name: assetId
          in: path
          required: true
          schema: { type: string }
        - name: point_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Qualidade/frescor dos dados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Modelos ----------------------------------------------------------
  /models/{modelId}:
    get:
      tags: [Modelos]
      operationId: getModel
      parameters:
        - $ref: '#/components/parameters/Seed'
        - name: modelId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Versão, cobertura, requisitos, estado de processamento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /models/{modelId}/request-retraining:
    post:
      tags: [Modelos]
      operationId: requestRetraining
      description: Solicita retreinamento. Ação de alto impacto; exige justificativa forte.
      security: [{ UserContext: [] }]
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionRequest' }
      responses:
        '200':
          description: Solicitação aceita.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Corpo ausente ou não representado por um objeto JSON. }

  # ---- Conhecimento -----------------------------------------------------
  /knowledge/search:
    get:
      tags: [Conhecimento]
      operationId: searchKnowledge
      parameters:
        - $ref: '#/components/parameters/Seed'
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: type
          in: query
          description: Filtro literal; valor desconhecido resulta em lista vazia.
          schema: { type: string }
      responses:
        '200': { description: Documentos relevantes. }
        '422': { description: Query obrigatória `q` ausente. }

  /knowledge/{docId}:
    get:
      tags: [Conhecimento]
      operationId: getKnowledgeDoc
      parameters:
        - $ref: '#/components/parameters/Seed'
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Documento de conhecimento. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Ações / Escalonamento -------------------------------------------
  /cases/{caseId}/escalate:
    post:
      tags: [Ações]
      operationId: escalateCase
      description: Solicita encaminhamento do caso para análise humana. Ação de impacto; exige justificativa.
      security: [{ UserContext: [] }]
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionRequest' }
      responses:
        '200':
          description: Escalonamento aceito.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Corpo ausente ou não representado por um objeto JSON. }
