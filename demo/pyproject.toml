[project]
name = "tractian-demo"
version = "0.1.0"
description = "Fachada local da central de casos TRACTIAN"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<0.112",
    "httpx>=0.27,<0.28",
    "pydantic>=2.7",
    "tractian-agent",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tractian_demo"]

[tool.uv.sources]
tractian-agent = { path = "../agent", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

