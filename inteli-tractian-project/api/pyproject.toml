[project]
name = "tractian-challenge-api"
version = "0.1.0"
description = "API industrial simplificada para o Challenge TRACTIAN x Inteli"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<0.112",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyarrow>=15",
    "pandas>=2.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27,<0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
