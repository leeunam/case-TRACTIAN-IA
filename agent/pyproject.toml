[project]
name = "tractian-agent"
version = "0.1.0"
description = "Agente de suporte industrial"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<0.28",
    "langchain>=1.3.18,<1.4",
    "langchain-groq>=1.1.3,<1.2",
    "langgraph>=1.2.11,<1.3",
    "langgraph-checkpoint-sqlite>=3.1.1,<3.2",
    "logfire>=4.41,<5",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tractian_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
