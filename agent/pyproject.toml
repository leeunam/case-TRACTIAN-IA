[project]
name = "tractian-agent"
version = "0.1.0"
description = "Agente de suporte industrial"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<0.28",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tractian_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
